<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Церковная лавка{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <style>
        /* Базовые глобальные стили */
        body {
            min-vh-100: 100vh;
        }
        /* Блок для кастомных стилей конкретных страниц */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">

<!-- Единый адаптивный Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid px-3">
        <!-- Логотип / Ссылка на главную -->
        <a class="navbar-brand fw-medium" href="{% url 'welcome_landing' %}">Церковная лавка</a>
        
        <!-- Кнопка-гамбургер для мобильных устройств -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Меню навигации -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                {% if user.is_authenticated %}
                    <!-- Ссылки видны только авторизованным сотрудникам -->
                    <li class="nav-item">
                        <a class="nav-link" href="/directory/">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/transactions/">Транзакции</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/reports/">Отчеты</a>
                    </li>
                {% endif %}
            </ul>
            
            <!-- Правая часть: Блок пользователя / Вход -->
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-light me-3 small">
                        Вы вошли как: <strong>{{ user.first_name|default:user.username }}</strong>
                    </span>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-danger">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-sm btn-primary me-2">Войти</a>
                    <a href="{% url 'register' %}" class="btn btn-sm btn-outline-light">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<!-- Основной контент страницы -->
{% block content %}
{% endblock %}
</body>
</html>
