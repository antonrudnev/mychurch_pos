<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | Церковная лавка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <style>
        body {
            /* Чистый белый фон по умолчанию */
            background-color: #000000; 
        }
        .login-container {
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="container d-flex justify-content-center px-3">
    <!-- Классическая карточка Bootstrap по умолчанию -->
    <div class="card login-container shadow-sm">
        <div class="card-body p-4">
            
            <!-- Заголовок -->
            <div class="text-center">
                <h2 class="fw-normal text-dark h4 mb-1">Церковная лавка</h2>
                <p class="text-muted small">Пожалуйста, авторизуйтесь</p>
            </div>

            <!-- Ошибки -->
            {% if form.errors %}
                <div class="alert alert-danger p-2 small" role="alert">
                    Неверное имя пользователя или пароль.
                </div>
            {% endif %}

            <!-- Форма -->
            <form method="post">
                {% csrf_token %}
                
                <!-- Поле ввода имени пользователя -->
                <div class="mb-3">
                    <label for="id_username" class="form-label small">Имя пользователя</label>
                    <input type="text" name="username" autofocus class="form-control" id="id_username" required placeholder="Логин">
                </div>

                <!-- Поле ввода пароля -->
                <div class="mb-4">
                    <label for="id_password" class="form-label small">Пароль</label>
                    <input type="password" name="password" class="form-control" id="id_password" required placeholder="Пароль">
                </div>

                <!-- Классическая синяя кнопка Bootstrap -->
                <button type="submit" class="btn btn-primary w-100 ">Войти</button>
                <div class="text-center mt-3">
                    <a href="{% url 'register' %}" class="small text-decoration-none">Еще нет аккаунта? Зарегистрироваться</a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
