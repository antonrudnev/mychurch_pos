{% extends 'base.html' %}

{% block title %}Пароль изменен | Церковная лавка{% endblock %}

{% block extra_css %}
    .password-change-container {
        max-width: 440px;
        width: 100%;
    }
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 120px);">
    <div class="card password-change-container border-subtle shadow-sm">
        <div class="card-body p-4 text-center">
            <i class="bi bi-shield-check fs-1 text-success mb-2"></i>
            <h2 class="fw-normal text-body h4 mb-2">Пароль изменен</h2>
            <p class="text-muted small mb-4">Новый пароль сохранен.</p>
            <a href="{% url 'welcome_landing' %}" class="btn btn-primary w-100 py-2 fw-medium">На главную</a>
        </div>
    </div>
</div>
{% endblock %}
