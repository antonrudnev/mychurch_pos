<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Церковная лавка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #000000; 
        }
        .register-container {
        max-width: 440px;
        width: 100%;
        /* Карточка тоже черная, чтобы сливаться с фоном */
        background-color: #000000 !important;
        /* Тонкая серая граница, чтобы карточка не терялась на черном фоне */
        border: 1px solid #343a40 !important; 
    }

    /* Делаем заголовки и названия полей белыми */
    .register-container h2, 
    .register-container .form-label {
        color: #ffffff !important;
    }

    /* Стилизация стандартных полей Django-формы */
    .register-container input {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        
        /* Цвет текста внутри полей — белый */
        color: #ffffff; 
        /* Фон полей — черный (как карточка и body) */
        background-color: #000000; 
        
        background-clip: padding-box;
        /* Строгая темно-серая граница для полей по умолчанию */
        border: 1px solid #495057; 
        border-radius: 0.375rem;
        margin-bottom: 1rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    /* Эффект при клике на поле (классический фокус Bootstrap) */
    .register-container input:focus {
        color: #ffffff;
        background-color: #121212; /* Едва заметный оттенок серого при вводе */
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    /* Плейсхолдеры (внутренние подсказки в полях) — светло-серые */
    .register-container input::placeholder {
        color: #6c757d;
        opacity: 1;
    }

    /* Подсказки Django под полями (helptext) — светло-серые */
    .register-container .helptext {
        display: block;
        font-size: 0.75rem;
        color: #adb5bd; /* Светло-серый цвет */
        margin-top: -0.75rem;
        margin-bottom: 1rem;
    }

    /* Список требований к паролю — светло-серый */
    .register-container ul {
        font-size: 0.75rem;
        color: #adb5bd; /* Светло-серый цвет */
        padding-left: 1.25rem;
        margin-bottom: 1rem;
    }

    /* Ссылка «Войти» внизу формы */
    .register-container a {
        color: #6ea8fe !important;
    }
</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="container d-flex justify-content-center px-3">
    <!-- Классическая карточка Bootstrap -->
    <div class="card register-container shadow-sm">
        <div class="card-body p-4">
            
            <!-- Заголовок -->
            <div class="text-center">
                <h2 class="fw-normal text-dark h4 mb-1">Церковная лавка</h2>
                <p class="text-muted small">Регистрация нового пользователя</p>
            </div>

            <!-- Вывод общих ошибок формы -->
            {% if form.errors %}
                <div class="alert alert-danger p-2 small" role="alert">
                    Пожалуйста, исправьте ошибки ниже.
                </div>
            {% endif %}

            <!-- Форма регистрации -->
            <form method="post">
                {% csrf_token %}
                
                <!-- Рендерим поля формы вручную для контроля разметки -->
                {% for field in form %}
                    <div class="mb-2">
                        <label for="{{ field.id_for_label }}" class="form-label small fw-medium mb-1">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            {% for error in field.errors %}
                                <div class="text-danger small mb-2">{{ error }}</div>
                            {% endfor %}
                        {% endif %}
                    </div>
                {% endfor %}

                <!-- Зеленая классическая кнопка для регистрации -->
                <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
            </form>

            <!-- Ссылка на авторизацию -->
            <div class="text-center">
                <a href="{% url 'login' %}" class="small text-decoration-none">Уже есть аккаунт? Войти</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
