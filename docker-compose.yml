version: '3.8'

services:
  web:
    build: .
    container_name: church_pos_web
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Изолируем папку статики, чтобы локальный код из .:/app не затирал собранную админку
      - /app/staticfiles  
      # Монтируем папку ./db_store на сервере в папку /app/db_volume внутри контейнера
      - ./db_store:/app/db_volume  
    environment:
      - TZ=Asia/Novokuznetsk
    # Накатываем миграции и запускаем Gunicorn
    command: >
      sh -c "python manage.py migrate && 
             gunicorn --bind 0.0.0.0:8000 config.wsgi:application"

volumes:
  db_data: