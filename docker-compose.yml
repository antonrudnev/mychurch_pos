services:
  default-cert:
    build: ./docker/default-cert
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - certs:/etc/nginx/certs

  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6.0
    container_name: nginx-proxy
    restart: always
    depends_on:
      default-cert:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro

  acme-dynu:
    profiles:
      - dns-01
    build: ./docker/acme-dynu
    restart: always
    depends_on:
      - nginx-proxy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      Dynu_ClientId: ${DYNU_CLIENT_ID:-}
      Dynu_Secret: ${DYNU_CLIENT_SECRET:-}
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme_dynu:/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["/bin/sh", "/usr/local/bin/issue-dynu-cert.sh"]

  letsencrypt:
    profiles:
      - http-01
    image: nginxproxy/acme-companion:2.4.0
    restart: always
    depends_on:
      - nginx-proxy
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme_http:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build: ./web
    restart: always
    mem_limit: 380m
    memswap_limit: 800m
    env_file: .env
    volumes:
      - ./db_volume:/app/db_volume
      - ./media:/app/media
    environment:
      PYTHONUNBUFFERED: "1"
      MALLOC_ARENA_MAX: "2"
      DEBUG: "False"
      TZ: ${TIME_ZONE:-Asia/Novokuznetsk}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in .env}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in .env}
      VIRTUAL_PATH: /
      HTTPS_METHOD: redirect
      LETSENCRYPT_HOST: ${DOMAIN:?Set DOMAIN in .env}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:?Set DJANGO_SUPERUSER_USERNAME in .env}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:?Set DJANGO_SUPERUSER_EMAIL in .env}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?Set DJANGO_SUPERUSER_PASSWORD in .env}
    command: >
      sh -c "python manage.py migrate &&
             python scripts/data_upload.py &&
             python scripts/ensure_superuser.py &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --max-requests 500 --max-requests-jitter 50"

  docscanner:
    image: ghcr.io/antonrudnev/mychurch-docscanner:latest
    restart: always
    mem_limit: 64m
    volumes:
      - ./db_volume:/app/db_volume
      - ./media/dropbox:/app/downloads
    environment:
      PORT: "8080"
      DB_PATH: /app/db_volume/db.sqlite3
      DOWNLOAD_DIR: /app/downloads
      TZ: ${TIME_ZONE:-Asia/Novokuznetsk}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:?Set DROPBOX_APP_KEY in .env}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:?Set DROPBOX_APP_SECRET in .env}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:?Set DROPBOX_REFRESH_TOKEN in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in .env}
      VIRTUAL_PATH: /webhook
      VIRTUAL_DEST: /webhook
      VIRTUAL_PORT: "8080"

volumes:
  certs:
  vhost.d:
  html:
  acme_dynu:
  acme_http:
